[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
swarmux-domain = { path = "crates/domain" }
swarmux-application = { path = "crates/application" }
swarmux-infrastructure = { path = "crates/infrastructure" }
swarmux-tui = { path = "crates/tui" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
ratatui = "0.30"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "net"] }
uuid = { version = "1.29.0", features = ["v4"] }

# The `swarmux` binary: composition root only.
[package]
name = "swarmux"
description = "A prompt-first command center for Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
swarmux-application.workspace = true
swarmux-domain.workspace = true
swarmux-infrastructure.workspace = true
swarmux-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
rpassword.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
