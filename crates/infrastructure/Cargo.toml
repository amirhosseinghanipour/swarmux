[package]
name = "swarmux-infrastructure"
description = "swarmux adapters: SQLite storage, the claude and git CLIs, system clock, paths."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Builds the test-only `fake_claude` binary used by tests/runner.rs.
fake-claude = []

[dependencies]
swarmux-domain.workspace = true
swarmux-application.workspace = true
keyring.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { workspace = true, features = ["disk", "network"] }
tokio.workspace = true
toml.workspace = true
minisign-verify.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
minisign.workspace = true

[[bin]]
name = "fake_claude"
path = "src/bin/fake_claude.rs"
required-features = ["fake-claude"]
test = false
doc = false
